server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://check-mysql:3306/check_in?useSSL=false&serverTimezone=Asia/Shanghai&autoReconnect=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      port: 6379
      host: check-redis
      lettuce:
        pool:
          max-active: 8
          max-idle: 6
          min-idle: 0
          max-wait: 1000
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  mapper-locations: classpath:/mapper/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cacheEnabled: true
    lazyLoadingEnabled: true
    aggressiveLazyLoading: true
    useColumnLabel: true
    mapUnderscoreToCamelCase: true

